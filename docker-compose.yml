services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: qqbot-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-qqbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qqbotpass}
      POSTGRES_DB: ${POSTGRES_DB:-qqbot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qqbot} -d $${POSTGRES_DB:-qqbot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - qqbot-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: qqbot-minio
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qqbot-net

  napcat:
    image: mlikiowa/napcat-docker@sha256:85825671fd536e7a46ccf5472fd7efae7053150ec1042ae4c4f1e0fb62f815fd
    container_name: qqbot-napcat
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config
    networks:
      - qqbot-net

networks:
  qqbot-net:
    name: qqbot-net
