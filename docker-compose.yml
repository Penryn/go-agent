services:
  mysql:
    image: mysql:8.0
    pull_policy: never
    container_name: qqbot-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qqbot}
      MYSQL_USER: ${MYSQL_USER:-qqbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qqbotpass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qqbot-net

  redis:
    image: redis:7-alpine
    pull_policy: never
    container_name: qqbot-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qqbot-net

  qdrant:
    image: qdrant/qdrant:v1.14.0
    pull_policy: never
    container_name: qqbot-qdrant
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - qqbot-net

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    pull_policy: never
    container_name: qqbot-minio
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - qqbot-net

  napcat:
    image: mlikiowa/napcat-docker:2.6.5
    pull_policy: never
    container_name: qqbot-napcat
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config
    networks:
      - qqbot-net

networks:
  qqbot-net:
    name: qqbot-net
