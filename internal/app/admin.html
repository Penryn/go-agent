<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群友 · 运行与记忆</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#25332c;background:#f5f6f2}body{max-width:1120px;margin:36px auto;padding:0 24px}h1{font-size:28px;margin-bottom:4px}h2{font-size:19px}p{color:#65736b}header,section{margin-bottom:28px}section{background:white;padding:22px;border:1px solid #e0e5df;border-radius:12px}input,textarea,select,button{font:inherit;border:1px solid #ccd5cc;border-radius:6px;padding:7px 10px;max-width:100%;box-sizing:border-box}button{background:#eaf1e7;color:#263e2d;cursor:pointer}button:disabled{opacity:.5}textarea{display:block;width:100%;min-height:70px;margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{font-size:13px;color:#758177}#status{min-height:24px;white-space:pre-wrap}.item{border-top:1px solid #ebeeea;padding:12px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.sticker img{max-width:100%;height:130px;object-fit:contain}
</style>
<header><h1>群友 · 运行与记忆</h1><p>查看真实对话、检索与发送结果，纠正笔记，管理全局表情包。</p><div class="row"><label>访问令牌 <input id="token" type="password" autocomplete="off" placeholder="本机未配置时可留空"></label><button id="connect">连接</button><label>群 <select id="group"><option value="">请选择</option></select></label><button id="refresh">刷新</button></div><div id="status" role="status" aria-live="polite"></div></header>
<section><h2>最近对话</h2><div id="messages" class="muted">选择群后查看。</div></section>
<section><h2>相处笔记</h2><p class="muted">修改会使旧向量失效，后台重新索引。遗忘后不会再检索这条笔记。</p><div id="notes"></div></section>
<section><h2>回应与检索记录</h2><div id="attempts"></div></section>
<section><h2>全局表情包</h2><p class="muted">从各群自动采集、全局去重和复用，重复发送冷却按群计算。禁用会阻止相同内容再次自动收入。</p><div id="stickers" class="stickers"></div></section>
<script>
const $=id=>document.getElementById(id);let urls=[];
function el(tag,value='',cls=''){const n=document.createElement(tag);n.textContent=value;n.className=cls;return n}
function status(value){$('status').textContent=value}
async function api(path,method='GET',body){const headers={};if($('token').value)headers.Authorization='Bearer '+$('token').value;if(body)headers['Content-Type']='application/json';const r=await fetch('/admin/api/'+path,{method,headers,body:body?JSON.stringify(body):undefined});if(!r.ok){const e=await r.json().catch(()=>({error:'请求失败'}));throw Error(e.error||'请求失败')}return r}
function button(title,fn,refreshAfter=true){const b=el('button',title);b.onclick=async()=>{b.disabled=true;try{await fn();if(refreshAfter)await refresh()}catch(e){status(e.message)}finally{b.disabled=false}};return b}
function editor(label,value){const n=document.createElement('textarea');n.value=value;n.setAttribute('aria-label',label);return n}
async function refresh(){try{status('正在读取');const g=$('group').value;
if(g){const d=await(await api('conversation?group='+encodeURIComponent(g))).json();$('messages').replaceChildren();for(const m of d.messages){const row=el('div','','item');row.append(el('div',`${new Date(m.at).toLocaleString()} · ${m.name||m.user_id}${m.recalled?' · 已撤回':''}`,'muted'),el('div',m.text,'message'));$('messages').append(row)}
$('notes').replaceChildren();for(const n of d.notes){const row=el('div','','item');const edit=editor('笔记内容',n.text);const save=forget=>api('notes/'+encodeURIComponent(n.id),'PATCH',{group:Number(g),version:n.version,text:forget?'':edit.value,forget});row.append(el('div',`${n.kind} · ${n.subject||'本群'} · ${n.key} · ${n.state}`,'muted'),edit,button('保存',()=>save(false)),document.createTextNode(' '),button('遗忘',()=>save(true)));$('notes').append(row)}
$('attempts').replaceChildren();for(const a of d.attempts){const row=document.createElement('details');row.className='item';row.append(el('summary',`${new Date(a.at).toLocaleString()} · ${a.state} · ${a.reply.reason||a.error||''}`),el('pre',JSON.stringify({reply:a.reply,retrieval:a.retrieval,usage:a.usage,error:a.error},null,2)));$('attempts').append(row)}}
for(const u of urls)URL.revokeObjectURL(u);urls=[];$('stickers').replaceChildren();for(const s of await(await api('stickers')).json()){const card=el('div','','sticker');const edit=editor('表情包含义',s.description);const save=blocked=>api('stickers/'+encodeURIComponent(s.id),'PATCH',{version:s.version,description:edit.value,blocked});card.append(el('div',s.state,'muted'));if(s.state==='ready')card.append(button('预览',async()=>{const r=await api('stickers/'+encodeURIComponent(s.id)+'/image');const u=URL.createObjectURL(await r.blob());urls.push(u);const image=document.createElement('img');image.src=u;image.alt=s.description;card.prepend(image)},false));card.append(edit,button('保存描述',()=>save(false)),document.createTextNode(' '),button('禁用',()=>save(true)));$('stickers').append(card)}status('已刷新')
}catch(e){status(e.message)}}
$('connect').onclick=async()=>{try{const groups=await(await api('groups')).json();const selected=$('group').value;$('group').replaceChildren();for(const g of groups){const o=el('option',String(g));o.value=String(g);$('group').append(o)}if(selected&&groups.map(String).includes(selected))$('group').value=selected;await refresh()}catch(e){status(e.message)}};$('group').onchange=refresh;$('refresh').onclick=refresh;
</script></html>
