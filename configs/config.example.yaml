# 本地配置复制为 config.yaml；真实密钥不入库。
app:
  mode: dev
  log_level: info
server:
  http_listen: 127.0.0.1:8088
  admin_token: ""
storage:
  # 新运行时使用独立 groupfriend schema，不覆盖旧表。
  database_url: postgres://qqbot:qqbotpass@127.0.0.1:5432/qqbot?sslmode=disable
# 底层模型并发上限，四个池互相隔离：各自排队，互不占用名额。
# chat 普通聊天；vision 带图请求；embedding 查询向量；background 后台任务。
model_concurrency:
  chat: 2
  vision: 1
  embedding: 2
  background: 1
models:
  main:
    provider: ark
    model: ""
    api_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout: 20s
  # 留空时，图片输入直接使用 main；main 需支持图片。
  vision:
    provider: ark
    model: ""
    api_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout: 15s
  embedding:
    provider: ark
    model: ""
    api_key: ""
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout: 10s
    api_type: multimodal
    dimensions: 2048
persona:
  name: 芙芙
  aliases: [芙芙, Fufu]
  description: 开朗、有一点小骄傲的虚拟群友，喜欢游戏、数码和日常闲聊。
  style: 自然口语，先接住当下的话，不客服腔，不固定总结或反问。
  interests: [游戏, 数码, 日常生活]
  examples:
    - 群友说今天好累，可以回：那先歇会儿
    - 群友彼此约时间，你没有参与时可以沉默
chat:
  merge: 1s
  max_wait: 3s
  passive_interval: 15s
  active_window: 90s
  timeout: 15s
  spontaneous_interval: 20s
  max_per_minute: 8
  poke_cooldown: 6h
  history: 80
  context_runes: 16000
memory:
  top_k: 6
  interval: 20s
  index_limit: 5000
  summary_batch: 8
  summary_interval: 30s
  # 语义召回使用余弦距离，范围 (0,2]，默认 0.6。
  semantic_distance_threshold: 0.6
  # 0 表示关闭该类别；未配置时使用默认值：偏好 6、成员 8、经历 6。
  # 三个预算之和不得超过 24。
  preference_budget: 6
  member_budget: 8
  episode_budget: 6
cache:
  max_items: 10000
  embedding_ttl: 30m
  index_ttl: 10m
  recall_ttl: 20s
  sticker_ttl: 20s
  image_ttl: 10m
  context_ttl: 10s
meme:
  auto_collect: true
  path: ./memes
  # 全局容量和磁盘用量；素材去重也按全局内容哈希。
  max_items: 5000
  max_bytes: 536870912
  max_image_bytes: 10485760
  # 重复发送冷却按群计算，不影响其他群使用同一张图。
  cooldown: 10m
  top_k: 5
qq:
  enabled: false
  self_id: 0
  outbound_url: http://127.0.0.1:3000
  outbound_token: ""
  event_ws_url: ws://127.0.0.1:3001
  event_ws_token: ""
  group_whitelist: []
